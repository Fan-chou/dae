  rs_domain_text: {providers: {p: {file: dom_text.txt, behavior: domain, format: text}}, rules: ["RULE-SET,p,PROXY"]}
  rs_cidr: {providers: {p: {file: cidr_basic.yaml, behavior: ipcidr}}, rules: ["RULE-SET,p,PROXY"]}
