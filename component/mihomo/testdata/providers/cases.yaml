  rs_fatal_empty_provider: {providers: {p: {file: empty.yaml, behavior: domain}}, rules: ["RULE-SET,p,PROXY"]}
  rs_fatal_bad_cidr: {providers: {p: {file: cidr_bad.yaml, behavior: ipcidr}}, rules: ["RULE-SET,p,PROXY"]}
  rs_fatal_missing_file: {providers: {p: {file: no_such_file.yaml, behavior: domain}}, rules: ["RULE-SET,p,PROXY"]}
  rs_fatal_unused_bad_behavior: {providers: {p: {file: dom_basic.yaml, behavior: domain}, bad: {file: dom_basic.yaml, behavior: wat}}, rules: ["RULE-SET,p,PROXY"]}
  rs_fatal_unused_bad_format: {providers: {p: {file: dom_basic.yaml, behavior: domain}, bad: {file: dom_basic.yaml, behavior: domain, format: mrs}}, rules: ["RULE-SET,p,PROXY"]}
