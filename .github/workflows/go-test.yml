name: Go Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
  push:
    branches:
      - main
      - kdae
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"

permissions: read-all

jobs:
  go_test:
    name: Go Unit Test
    runs-on: ubuntu-22.04
    env:
      GOEXPERIMENT: heapminimum512kib,randomizedheapbase64
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go 1.27
        uses: ./.github/actions/setup-kdae-go
        with:
          go-version: "1.27"

      - name: Run tests
        run: |
          git submodule update --init --recursive
          go test -tags dae_stub_ebpf ./...

  go_test_race:
    # Reload, UDP dispatch and connectivity checking are concurrent by
    # construction. Their tests only mean something under the race detector.
    name: Go Race Detector
    runs-on: ubuntu-22.04
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go 1.27
        uses: ./.github/actions/setup-kdae-go
        with:
          go-version: "1.27"

      - name: Run tests with race detector
        run: |
          git submodule update --init --recursive
          go test -race -tags dae_stub_ebpf -timeout 30m ./control/... ./component/... ./cmd/...

  go_vet_real_datapath:
    # go_test builds everything with dae_stub_ebpf, which excludes the real
    # datapath sources. Without this job a compile error in any !dae_stub_ebpf
    # file reaches main unnoticed.
    name: Go Vet (real eBPF datapath)
    runs-on: ubuntu-22.04
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go 1.27
        uses: ./.github/actions/setup-kdae-go
        with:
          go-version: "1.27"

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Generate eBPF bindings
        run: |
          git submodule update --init --recursive
          make ebpf

      - name: Vet real datapath
        run: go vet ./...
